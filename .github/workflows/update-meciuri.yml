name: Update Meciuri

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.run-fetch'
      - 'fetch_data.py'
      - 'predict_current.py'
      - 'fetch_stats_incidents_cache.py'
      - 'feature_engineering.py'
      - '.github/workflows/update-meciuri.yml'

permissions:
  contents: write

concurrency:
  group: update-meciuri-live-data
  cancel-in-progress: false

jobs:
  update-meciuri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests catboost scikit-learn pandas numpy scipy

      - name: Fetch current data
        id: fetch_current
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Starting fetch_data.py at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          timeout 2400s python -u fetch_data.py
          echo "Finished fetch_data.py at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: VEYRA Supreme v5 — stats/incidents/shotmap/player cache
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          PYTHONUNBUFFERED: '1'
          STATS_FETCH_LIMIT: '160'
          STATS_RECENT_PER_TEAM: '6'
          STATS_SLEEP_SECONDS: '0.15'
        run: |
          if [ -f fetch_stats_incidents_cache.py ]; then
            echo "Fetching v2 stats/incidents/shotmap/player-stats priority cache at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            timeout 600s python -u fetch_stats_incidents_cache.py || echo "Stats/incidents/shotmap/player-stats cache skipped/timed out; non-fatal."
          else
            echo "fetch_stats_incidents_cache.py missing; skip stats cache."
          fi
        continue-on-error: true

      - name: Player quality profiles cache
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ -f fetch_player_profiles_cache.py ]; then
            echo "Starting fetch_player_profiles_cache.py at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            timeout 480s python -u fetch_player_profiles_cache.py || echo "Player profiles cache skipped/timed out; non-fatal."
          else
            echo "fetch_player_profiles_cache.py missing; skip."
          fi
        continue-on-error: true

      - name: Social news risk cache
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ -f fetch_social_news_cache.py ]; then
            echo "Starting fetch_social_news_cache.py at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            timeout 300s python -u fetch_social_news_cache.py || echo "Social news cache skipped/timed out; non-fatal."
          else
            echo "fetch_social_news_cache.py missing; skip."
          fi
        continue-on-error: true

      - name: VEYRA Supreme v5 — current CatBoost signals
        id: predict_current
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          status="skipped"
          if [ -f predict_current.py ]; then
            echo "Starting predict_current.py at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            if timeout 900s python -u predict_current.py; then
              status="success"
            else
              status="failed_or_timeout"
              echo "predict_current.py failed/timed out; non-fatal, enrich will use any existing ev_signals_v2.json."
            fi
            echo "Finished predict_current.py with status=$status at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          else
            echo "predict_current.py missing; skip CatBoost current signals."
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Optional enrich
        id: enrich_current
        run: |
          if [ -f enrich_predictions.py ]; then
            timeout 420s python -u enrich_predictions.py || echo "Optional enrich skipped or timed out; non-fatal."
          fi

      - name: Generate Claude AI previews (VERDICT/GASIT/CONCLUZIE in romana)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f generate_claude_previews.py ]; then
            pip install anthropic 2>/dev/null | tail -1
            timeout 300s python -u generate_claude_previews.py || echo "Claude previews skipped/timed out; non-fatal."
          fi
        continue-on-error: true

      - name: Build Claude daily analysis (top picks + acumulator)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f build_claude_daily.py ]; then
            pip install google-genai 2>/dev/null | tail -1
            timeout 120s python -u build_claude_daily.py || echo "Claude daily analysis skipped; non-fatal."
          fi
        continue-on-error: true

      - name: Build AI predictions tracking
        run: |
          if [ -f build_ai_predictions_tracking.py ]; then
            timeout 120s python -u build_ai_predictions_tracking.py || echo "AI tracking skipped; non-fatal."
          fi
        continue-on-error: true

      - name: Update meta marker
        env:
          FETCH_STATUS: ${{ steps.fetch_current.outcome }}
          PREDICT_STATUS: ${{ steps.predict_current.outputs.status }}
          ENRICH_STATUS: ${{ steps.enrich_current.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('data/meta.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              meta = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          except Exception:
              meta = {}
          now = datetime.now(timezone.utc).isoformat()
          meta['updated_at'] = now
          meta['fetched_at'] = now
          meta['workflow_updated_at'] = now
          meta['repo'] = 'Balty1991/VEYRA'
          meta['update_workflow'] = 'update-meciuri'
          meta['workflow_results'] = {
              'fetch_data': os.environ.get('FETCH_STATUS', 'unknown'),
              'predict_current': os.environ.get('PREDICT_STATUS', 'unknown'),
              'enrich_predictions': os.environ.get('ENRICH_STATUS', 'unknown'),
              'build_api_events_index': 'skipped_in_fast_update'
          }
          meta['status'] = 'ok' if meta['workflow_results']['fetch_data'] == 'success' else 'fetch_data_failed_or_timeout'
          path.write_text(json.dumps(meta, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('updated_at=' + now)
          print('status=' + str(meta.get('status')))
          PY

      - name: Commit data files
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Auto-update meciuri $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git pull --rebase -X ours origin main || {
            git rebase --abort || true
            git reset --soft origin/main
            git add data/
            git commit -m "Auto-update meciuri $(date -u '+%Y-%m-%d %H:%M UTC') rebased" || true
          }
          git push origin HEAD:main
