name: Update Meciuri

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.run-fetch'
      - 'fetch_data.py'
      - '.github/workflows/update-meciuri.yml'

permissions:
  contents: write

concurrency:
  group: update-meciuri-live-data
  cancel-in-progress: false

jobs:
  update-meciuri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch current data
        id: fetch_current
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: timeout 540s python fetch_data.py

      - name: Optional enrich
        id: enrich_current
        run: |
          if [ -f enrich_predictions.py ]; then
            timeout 120s python enrich_predictions.py || echo "Optional enrich skipped or timed out; non-fatal."
          fi

      - name: Update meta marker
        env:
          FETCH_STATUS: ${{ steps.fetch_current.outcome }}
          ENRICH_STATUS: ${{ steps.enrich_current.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('data/meta.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              meta = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          except Exception:
              meta = {}
          now = datetime.now(timezone.utc).isoformat()
          meta['updated_at'] = now
          meta['fetched_at'] = now
          meta['workflow_updated_at'] = now
          meta['repo'] = 'Balty1991/VEYRA'
          meta['update_workflow'] = 'update-meciuri'
          meta['workflow_results'] = {
              'fetch_data': os.environ.get('FETCH_STATUS', 'unknown'),
              'enrich_predictions': os.environ.get('ENRICH_STATUS', 'unknown'),
              'build_api_events_index': 'skipped_in_fast_update'
          }
          meta['status'] = 'ok' if meta['workflow_results']['fetch_data'] == 'success' else 'fetch_data_failed_or_timeout'
          path.write_text(json.dumps(meta, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print('updated_at=' + now)
          print('status=' + str(meta.get('status')))
          PY

      - name: Commit data files
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Auto-update meciuri $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git pull --rebase -X ours origin main || {
            git rebase --abort || true
            git reset --soft origin/main
            git add data/
            git commit -m "Auto-update meciuri $(date -u '+%Y-%m-%d %H:%M UTC') rebased" || true
          }
          git push origin HEAD:main
