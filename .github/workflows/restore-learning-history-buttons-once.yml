name: Restore Learning History Buttons Once

on:
  push:
    paths:
      - '.cleanup/restore-learning-history-buttons.trigger'

permissions:
  contents: write

jobs:
  restore-learning-history-buttons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore learning history buttons
        run: python tools/restore_learning_history_buttons_once.py
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore learning history navigation buttons"
            git push
          fi
