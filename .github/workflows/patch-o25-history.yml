name: Patch O25 history tracker

on:
  push:
    paths:
      - ".github/workflows/patch-o25-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Over 2.5 history patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/historic_meciuri_tracker.js')
          s = p.read_text()
          s = s.replace('window.__batHistoricTrackerV5', 'window.__batHistoricTrackerV6')
          s = s.replace('o15/btts/u35, riskTier pentru safe/value).', 'o15/o25/btts/u35, riskTier pentru safe/value).')
          s = s.replace("{ key:'o15',   label:'\\uD83D\\uDD25 O1.5',   accent:'rgba(249,115,22,.9)'  },\n    { key:'btts'", "{ key:'o15',   label:'\\uD83D\\uDD25 O1.5',   accent:'rgba(249,115,22,.9)'  },\n    { key:'o25',   label:'\\uD83D\\uDCC8 O2.5',   accent:'rgba(16,185,129,.9)'  },\n    { key:'btts'")
          s = s.replace("if (key === 'o15')   return mk === 'over15';\n    if (key === 'btts')", "if (key === 'o15')   return mk === 'over15';\n    if (key === 'o25')   return mk === 'over25';\n    if (key === 'btts')")
          s = s.replace("if(document.getElementById('bat-hist-v5-css'))return;", "if(document.getElementById('bat-hist-v6-css'))return;")
          s = s.replace("s.id='bat-hist-v5-css';", "s.id='bat-hist-v6-css';")

          old = """  // Verifica daca meciul are tipul t in bestBet SAU in eligibleCandidates
  function matchHasEligType(m,t){
    if(!m.bestBet)return false;
    if(m.bestBet.type===t)return true;
    return Array.isArray(m.eligibleCandidates)&&m.eligibleCandidates.some(function(c){
      return c.bestBet&&c.bestBet.type===t;
    });
  }

  // Filtru per categorie — identic cu renderMatches() din app.js
  function matchInCat(m,catKey){
    if(!m||m.analysisState!=='ELIGIBLE'||!m.bestBet)return false;
    var b=m.bestBet;
    if(DC_MKTS[b.type||''])return false;
    if(catKey==='all')   return true;
    if(catKey==='safe')  return m.verdict==='safe'||m.riskTier==='Safe';
    if(catKey==='o15')   return matchHasEligType(m,'over15');
    if(catKey==='btts')  return matchHasEligType(m,'btts');
    if(catKey==='u35')   return matchHasEligType(m,'under35');
    if(catKey==='value') return m.riskTier==='Value'||(nv(b.value)>=0.08&&nv(b.edgePct)>=3);
    return false;
  }
"""
          new = """  function matchEventId(m){
    return String(m&&(m.eventId!=null?m.eventId:(m.event_id!=null?m.event_id:''))||'');
  }
  function signalAuditRows(){
    return (window.SIGNAL_AUDIT&&Array.isArray(window.SIGNAL_AUDIT.rows))?window.SIGNAL_AUDIT.rows:[];
  }
  function isOver25AuditRow(r){
    var mk=String(r&&r.market_key||'').toLowerCase();
    var ml=String(r&&r.market||'').toLowerCase();
    return mk==='over25'||ml==='over 2.5g'||ml==='over 2.5'||ml==='o2.5g'||ml==='o2.5';
  }
  function getOver25AuditRow(m){
    var eid=matchEventId(m); if(!eid)return null;
    var rows=signalAuditRows();
    for(var i=0;i<rows.length;i++){
      var r=rows[i]||{};
      var rid=String(r.event_id!=null?r.event_id:(r.eventId!=null?r.eventId:''));
      if(rid===eid&&isOver25AuditRow(r))return r;
    }
    return null;
  }
  function hasOver25Audit(m){ return !!getOver25AuditRow(m); }

  // Verifica daca meciul are tipul t in bestBet SAU in eligibleCandidates
  function matchHasEligType(m,t){
    if(!m)return false;
    if(m.bestBet&&m.bestBet.type===t)return true;
    return Array.isArray(m.eligibleCandidates)&&m.eligibleCandidates.some(function(c){
      return c.bestBet&&c.bestBet.type===t;
    });
  }

  // Filtru per categorie — identic cu renderMatches() din app.js
  function matchInCat(m,catKey){
    if(!m)return false;
    if(catKey==='o25'){
      return (m.analysisState==='ELIGIBLE'&&matchHasEligType(m,'over25'))||hasOver25Audit(m);
    }
    if(!m||m.analysisState!=='ELIGIBLE'||!m.bestBet)return false;
    var b=m.bestBet;
    if(DC_MKTS[b.type||''])return false;
    if(catKey==='all')   return true;
    if(catKey==='safe')  return m.verdict==='safe'||m.riskTier==='Safe';
    if(catKey==='o15')   return matchHasEligType(m,'over15');
    if(catKey==='btts')  return matchHasEligType(m,'btts');
    if(catKey==='u35')   return matchHasEligType(m,'under35');
    if(catKey==='value') return m.riskTier==='Value'||(nv(b.value)>=0.08&&nv(b.edgePct)>=3);
    return false;
  }
"""
          if old in s:
              s = s.replace(old, new)

          old = """      var mktOdds=nv(b.odds);
      var mktProb=nv(b.adjProb);
      var mktEdge=nv(b.edgePct);

      var typeMap={o15:'over15',btts:'btts',u35:'under35'};
      var wantedType=typeMap[catKey];
      if(wantedType&&mktKey!==wantedType&&Array.isArray(m.eligibleCandidates)){
        var cand=m.eligibleCandidates.find(function(c){return c.bestBet&&c.bestBet.type===wantedType;});
        if(cand&&cand.bestBet){
          mktKey=cand.bestBet.type||mktKey;
          mktLabel=cand.bestBet.label||mktLabel;
          mktOdds=nv(cand.bestBet.odds)||mktOdds;
          mktProb=nv(cand.bestBet.adjProb)||mktProb;
          mktEdge=nv(cand.bestBet.edgePct)||mktEdge;
        }
      }
      return{
        _st:'pending',source:'live',
        event_id:m.eventId!=null?m.eventId:m.id,
        home:m.home,away:m.away,league:m.league,
        event_date:m.date||m.event_date,
        market_key:mktKey,market:mktLabel,
        odds:mktOdds,adjusted_prob:mktProb,edge_pct:mktEdge,
        value:nv(b.value),verdict:m.verdict||'',
        score:nv(m.smartScore),riskTier:m.riskTier||''
      };
"""
          new = """      var mktOdds=nv(b.odds);
      var mktProb=nv(b.adjProb);
      var mktEdge=nv(b.edgePct);
      var mktValue=nv(b.value);
      var mktScore=nv(m.smartScore||b.score);
      var mktVerdict=m.verdict||b.verdict||'';
      var mktRisk=m.riskTier||b.riskTier||'';

      var typeMap={o15:'over15',o25:'over25',btts:'btts',u35:'under35'};
      var wantedType=typeMap[catKey];
      if(wantedType&&mktKey!==wantedType&&Array.isArray(m.eligibleCandidates)){
        var cand=m.eligibleCandidates.find(function(c){return c.bestBet&&c.bestBet.type===wantedType;});
        if(cand&&cand.bestBet){
          mktKey=cand.bestBet.type||mktKey;
          mktLabel=cand.bestBet.label||mktLabel;
          mktOdds=nv(cand.bestBet.odds)||mktOdds;
          mktProb=nv(cand.bestBet.adjProb)||mktProb;
          mktEdge=nv(cand.bestBet.edgePct)||mktEdge;
          mktValue=nv(cand.bestBet.value)||mktValue;
          mktScore=nv(cand.ticketScore||cand.bestBet.score)||mktScore;
          mktVerdict=cand.bestBet.verdict||mktVerdict;
          mktRisk=cand.bestBet.riskTier||mktRisk;
        }
      }
      if(catKey==='o25'&&mktKey!=='over25'){
        var ar=getOver25AuditRow(m);
        if(ar){
          mktKey='over25';
          mktLabel=ar.market||'Over 2.5G';
          mktOdds=nv(ar.odds||ar.best_odds)||mktOdds;
          mktProb=nv(ar.adjusted_prob||ar.model_prob||ar.prob)||mktProb;
          mktEdge=nv(ar.edge_pct||ar.edgePct)||mktEdge;
          mktValue=nv(ar.value)||mktValue;
          mktScore=nv(ar.score||ar.smartScore)||mktScore;
          mktVerdict=ar.verdict||mktVerdict;
          mktRisk=ar.risk_tier||ar.riskTier||mktRisk;
        }
      }
      return{
        _st:'pending',source:'live',
        event_id:m.eventId!=null?m.eventId:(m.event_id!=null?m.event_id:m.id),
        home:m.home,away:m.away,league:m.league,
        event_date:m.date||m.event_date,
        market_key:mktKey,market:mktLabel,
        odds:mktOdds,adjusted_prob:mktProb,edge_pct:mktEdge,
        value:mktValue,verdict:mktVerdict,
        score:mktScore,riskTier:mktRisk
      };
"""
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text().replace('historic_meciuri_tracker.js?v=20260501hist1', 'historic_meciuri_tracker.js?v=20260501hist2')
          p.write_text(s)

          p = Path('fetch_data.py')
          s = p.read_text()
          s = s.replace('if "over15"  in _all_mkt_keys: _eligible_cats.append("o15")\n        if "btts"', 'if "over15"  in _all_mkt_keys: _eligible_cats.append("o15")\n        if "over25"  in _all_mkt_keys: _eligible_cats.append("o25")\n        if "btts"')
          p.write_text(s)
          PY

      - name: Validate patch
        run: |
          node --check assets/historic_meciuri_tracker.js
          python3 -m py_compile fetch_data.py

      - name: Commit patched files
        run: |
          git config user.name "actions-user"
          git config user.email "actions-user@users.noreply.github.com"
          rm -f .github/workflows/patch-o25-history.yml
          git add assets/historic_meciuri_tracker.js index.html fetch_data.py .github/workflows/patch-o25-history.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Over 2.5 to history tracker"
          git push
