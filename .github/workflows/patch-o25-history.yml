name: Patch O25 history tracker
on:
  push:
    paths:
      - ".github/workflows/patch-o25-history.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove this workflow file
        run: |
          git config user.name "actions-user"
          git config user.email "actions-user@users.noreply.github.com"
          rm -f .github/workflows/patch-o25-history.yml
          git add .github/workflows/patch-o25-history.yml
          git diff --cached --quiet || git commit -m "Remove patch workflow" && git push
