name: Remove Dashboard Once

on:
  push:
    paths:
      - '.cleanup/remove-dashboard.trigger'

permissions:
  contents: write

jobs:
  remove-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove Dashboard code and DOM
        run: python tools/remove_dashboard_once.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove Dashboard content and renderers"
            git push
          fi
