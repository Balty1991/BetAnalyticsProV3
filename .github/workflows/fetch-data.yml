name: Fetch BetAnalytics Data

on:
  schedule:
    - cron: '*/5 * * * *'  # La fiecare 5 minute
  workflow_dispatch:
  push:
    paths-ignore:
      - '.keep-alive'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: fetch-betanalytics-data
  cancel-in-progress: true

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch predictions and events
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python fetch_data.py

      - name: Update keep-alive timestamp
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > .last-run
          git add .last-run

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            # Facem un commit gol pentru a menține workflow-ul activ
            git commit --allow-empty -m "Keep-alive check $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            git commit -m "Auto-update data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Workflow failed! Check logs for details."
