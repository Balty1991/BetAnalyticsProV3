name: Fetch VEYRA Data

on:
  schedule:
    # Două execuții, 07:20/18:20 EET și 08:20/19:20 EEST.
    - cron: '20 5,16 * * *'

permissions:
  contents: write

concurrency:
  group: veyra-api-budget
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: pip install requests
      - name: Refresh compact, cu o singură cerere API
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python3 fetch_lightweight_feed.py
      - name: Commit starea bugetului și feedul actualizat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/api_request_budget.json data/meta.json
          git diff --staged --quiet || git commit -m "chore: budgeted VEYRA API refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || (git fetch origin main && git rebase origin/main && git push)
