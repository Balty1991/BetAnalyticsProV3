name: Fetch VEYRA Data

on:
  schedule:
    - cron: '20 2,14 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.run-fetch'

permissions:
  contents: write

concurrency:
  group: fetch-veyra-data
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic tavily-python google-genai

      - name: Fetch referee stats (weekly cache + trend repair)
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          REFEREE_TREND_LIMIT: '200'
        run: |
          NEED_REFRESH=0
          if [ ! -f data/referee_stats.json ]; then
            echo "Referee stats missing."
            NEED_REFRESH=1
          elif [ "$(find data/referee_stats.json -mtime +7)" != "" ]; then
            echo "Referee stats older than 7 days."
            NEED_REFRESH=1
          else
            python - <<'PY' || NEED_REFRESH=1
          import json, sys
          from pathlib import Path
          path = Path('data/referee_stats.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              sys.exit(1)
          refs = data.get('referees') or {}
          if not refs:
              sys.exit(1)
          sample = list(refs.values())[:80]
          has_trend_schema = any(isinstance(r, dict) and ('yellow_trend' in r or 'goals_trend' in r) for r in sample)
          if not has_trend_schema:
              print('Referee stats cache has no trend schema; refresh needed.')
              sys.exit(1)
          print('Referee stats cache valid and trend schema present.')
          PY
          fi

          if [ "$NEED_REFRESH" = "1" ]; then
            echo "Fetching referee stats with recent trend..."
            timeout 900s python -u fetch_referee_stats.py || echo "Referee stats refresh failed/timed out; non-fatal."
          else
            echo "Referee stats cache valid (< 7 zile) and trend-ready; skip fetch."
          fi

      - name: Fetch lineups for today's matches
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python fetch_lineups_today.py

      - name: Fetch predictions and events
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python fetch_data.py

      - name: VEYRA Supreme v5 — API v2 enrichment cache
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: |
          if [ -f fetch_v2_enrichment_cache.py ]; then
            echo "Fetching API v2 enrichment cache before Supreme Engine v5..."
            timeout 600s python -u fetch_v2_enrichment_cache.py || echo "API v2 enrichment skipped/timed out; non-fatal."
          else
            echo "fetch_v2_enrichment_cache.py missing; skip API v2 enrichment."
          fi
        continue-on-error: true

      - name: Team form cache
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: |
          if [ -f fetch_team_form_cache.py ]; then
            echo "Fetching team form cache at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            timeout 360s python -u fetch_team_form_cache.py || echo "Team form cache skipped/timed out; non-fatal."
          else
            echo "fetch_team_form_cache.py missing; skip."
          fi
        continue-on-error: true

      - name: Social news cache (risk layer pre-meci)
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: |
          if [ -f fetch_social_news_cache.py ]; then
            echo "Fetching social news cache la $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            timeout 300s python -u fetch_social_news_cache.py || echo "Social news cache skipped/timed out; non-fatal."
          else
            echo "fetch_social_news_cache.py missing; skip."
          fi
        continue-on-error: true

      - name: Player profiles quality cache
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: |
          if [ -f fetch_player_profiles_cache.py ]; then
            echo "Fetching player profiles cache la $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            timeout 300s python -u fetch_player_profiles_cache.py || echo "Player profiles cache skipped/timed out; non-fatal."
          else
            echo "fetch_player_profiles_cache.py missing; skip."
          fi
        continue-on-error: true

      - name: Verify cached data exists
        run: |
          test -f data/predictions.json
          test -f data/events.json
          test -f data/recommendation_log.json

      # ─── CatBoost ÎNAINTE de enrich — catboost_signal trebuie să existe în ev_signals_v2.json
      # înainte ca enrich_predictions.py să îl citească și să îl adauge pe predictions ───────────
      - name: SmartBet v2 — Verificare modele (retrain dacă lipsesc)
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: |
          MODEL_COUNT=$(ls models/catboost_*.cbm 2>/dev/null | wc -l)
          echo "Modele CatBoost găsite: $MODEL_COUNT"
          if [ "$MODEL_COUNT" -lt 3 ]; then
            echo "⚠️  Modele lipsă — pornesc retrain automat (durată ~10-15 min)..."
            pip install catboost scikit-learn pandas numpy scipy 2>/dev/null | tail -3
            python feature_engineering.py
            python train_engine_v2.py --skip-shap
            MODEL_COUNT_AFTER=$(ls models/catboost_*.cbm 2>/dev/null | wc -l)
            echo "✅ Retrain complet: $MODEL_COUNT_AFTER modele generate"
            git config user.name "actions-user"
            git config user.email "actions-user@users.noreply.github.com"
            git add models/
            git diff --staged --quiet || git commit -m "chore(ml): auto-retrain modele lipsă $(date -u +%Y-%m-%dT%H:%M)"
            git fetch origin
            git merge origin/main -X ours --no-edit 2>/dev/null || true
            git push || true
          else
            echo "✅ Modele OK ($MODEL_COUNT găsite) — skip retrain"
          fi

      - name: VEYRA Supreme v5 — Predicții multi-source pe meciuri curente
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: |
          pip install catboost scikit-learn pandas numpy 2>/dev/null | tail -1
          python predict_current.py
        continue-on-error: true
      # ────────────────────────────────────────────────────────────────────────────────────────────

      - name: Enrich predictions with EV/Kelly/fair_odds/risk_tier
        run: python enrich_predictions.py

      - name: Build Claude daily analysis (top picks + acumulator)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f build_claude_daily.py ]; then
            timeout 120s python -u build_claude_daily.py || echo "Claude daily analysis skipped; non-fatal."
          fi
        continue-on-error: true

      - name: Build AI predictions tracking
        run: |
          if [ -f build_ai_predictions_tracking.py ]; then
            timeout 120s python -u build_ai_predictions_tracking.py || echo "AI tracking skipped; non-fatal."
          fi
        continue-on-error: true

      - name: Motor AI — analiză per meci cu Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f build_ai_match_engine.py ]; then
            timeout 180s python -u build_ai_match_engine.py || echo "Motor AI skipped; non-fatal."
          fi
        continue-on-error: true

      - name: Build API history catalog
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_api_history.py

      - name: Build recent historical events index
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_api_events_index.py

      - name: Build training dataset
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_training_dataset.py

      - name: Build training features
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_training_features.py

      - name: Build training model pack
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_training_model_pack.py

      - name: Build training scoring baselines
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_training_scores.py

      - name: Build training insights
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_training_insights.py

      - name: Build full history journal and patch index
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          FULL_HISTORY_LOOKBACK_DAYS: '730'
          FULL_HISTORY_MAX_ROWS: '60000'
          FULL_HISTORY_PREDICTION_MAX_AGE_HOURS: '17544'
        run: python build_full_history.py

      - name: Build AI Memory enhanced
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_ai_memory_enhanced.py

      - name: Build prediction type history
        run: python build_prediction_type_history.py

      - name: Build Hybrid Adaptive Predictions
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python build_adaptive_predictions.py

      - name: Walk-Forward Validation (calibrare time-series)
        run: python build_wfv_validation.py

      - name: Build model quality audit
        run: python build_model_quality.py

      - name: Build Model Benchmarks (model vs model per ligă și piață)
        run: python build_model_benchmarks.py

      - name: Patch Over 1.5 recovery probe
        run: python patch_over15_recovery_probe.py

      - name: Build professional intelligence cockpit data
        run: python build_pro_intelligence.py

      - name: Build CLV Tracker (Closing Line Value)
        run: python build_clv_tracker.py
        continue-on-error: true

      - name: Apply CLV quality layer
        run: python build_clv_quality.py
        continue-on-error: true

      - name: Install CLV card guidance loader
        run: python patch_clv_guidance_loader.py
        continue-on-error: true

      - name: Commit and push changes when data changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Safe add: folosim folderele, nu listă rigidă de fișiere JS/CSS.
          # Astfel workflow-ul nu mai pică dacă un asset auxiliar este șters intenționat.
          git add -A data/ index.html assets/ \
            build_claude_daily.py \
            build_ai_predictions_tracking.py \
            build_ai_match_engine.py \
            build_adaptive_predictions.py \
            build_prediction_type_history.py \
            build_training_features.py \
            build_training_model_pack.py \
            build_model_quality.py \
            build_model_benchmarks.py \
            build_pro_intelligence.py \
            build_wfv_validation.py \
            build_clv_tracker.py \
            build_clv_quality.py \
            patch_clv_guidance_loader.py \
            patch_over15_recovery_probe.py \
            .github/workflows/fetch-data.yml \
            .github/workflows/pro-intelligence.yml \
            .gitignore

          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main || {
            git rebase --abort
            git fetch origin main
            git reset --hard origin/main
            git add -A data/ index.html assets/
            git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC') [conflict-resolved]" || true
          }
          git push origin HEAD:main

      - name: Notify on failure
        if: failure()
        run: echo "::error::Workflow failed!"
