name: Fetch BetAnalytics Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch predictions and events
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python fetch_data.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update data $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Pull latest changes
        run: |
          git pull --rebase origin main || true

      - name: Push changes
        run: |
          git push || true
