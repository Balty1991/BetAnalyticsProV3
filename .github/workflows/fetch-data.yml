name: Fetch BetAnalytics Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths-ignore:
      - '.keep-alive'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: fetch-betanalytics-data
  cancel-in-progress: true

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch predictions and events
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python fetch_data.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > .last-run
          git add data/ .last-run
          
          if git diff --staged --quiet; then
            echo "No changes - keep-alive commit"
            git commit --allow-empty -m "Keep-alive $(date -u '+%Y-%m-%d %H:%M UTC')"
          else
            git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
          
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Notify on failure
        if: failure()
        run: echo "::error::Workflow failed!"
