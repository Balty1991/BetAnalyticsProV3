name: Remove Orphan Tabs Once

on:
  push:
    paths:
      - '.cleanup/remove-orphan-tabs.trigger'

permissions:
  contents: write

jobs:
  remove-orphan-tabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove orphan tab DOM
        run: python tools/remove_orphan_tabs_once.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove orphan tab DOM"
            git push
          fi
