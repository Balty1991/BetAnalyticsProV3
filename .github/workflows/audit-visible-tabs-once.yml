name: Audit Visible Tabs Once

on:
  push:
    paths:
      - '.cleanup/audit-visible-tabs.trigger'

permissions:
  contents: write

jobs:
  audit-visible-tabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate visible tabs audit
        run: python tools/audit_visible_tabs_once.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cleanup_tab_audit.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add visible tabs audit report"
            git push
          fi
