name: Audit Popup Messages Once

on:
  push:
    paths:
      - '.cleanup/audit-popup-messages.trigger'

permissions:
  contents: write

jobs:
  audit-popup-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate popup message audit
        run: python tools/audit_popup_messages_once.py
      - name: Commit popup message audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cleanup_popup_messages_audit.json cleanup_popup_messages_audit.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add popup message audit report"
            git push
          fi
