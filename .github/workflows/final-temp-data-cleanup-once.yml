name: Final Temp Data Cleanup Once

on:
  push:
    paths:
      - '.cleanup/final-temp-data-cleanup.trigger'

permissions:
  contents: write

jobs:
  final-temp-data-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run final temp and data app cleanup
        run: python tools/final_temp_and_data_app_cleanup_once.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clean temporary reports and stale data app"
            git push
          fi
