name: SmartBet Fusion v2 — Full ML Pipeline

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mod rulare'
        required: true
        default: 'full-retrain'
        type: choice
        options:
          - full-retrain
          - incremental
          - features-only

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ─── JOB 1: Fetch + Features + Train + Export (un singur job) ──────────────
  full-pipeline:
    name: 'SmartBet v2 Full Pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install catboost shap scikit-learn pandas numpy scipy requests tqdm optuna

      # ─── FETCH ────────────────────────────────────────────────────────────
      - name: Fetch date istorice (FULL — toate sezoanele)
        run: python3 fetch_history_batch.py --mode full
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          DELAY_MS: '400'

      - name: Verificare warehouse
        run: |
          python3 -c "
          import json
          from pathlib import Path
          files = list(Path('data/warehouse').glob('events_season_*.json'))
          total = sum(len(json.load(open(f))) for f in files)
          print(f'Warehouse: {len(files)} sezoane, {total} meciuri')
          if total < 1000:
              raise SystemExit('EROARE: Prea puțin date în warehouse!')
          "

      # ─── FEATURES ─────────────────────────────────────────────────────────
      - name: Feature engineering
        run: python3 feature_engineering.py

      - name: Verificare features
        run: |
          python3 -c "
          import json
          rows = json.load(open('data/features_v2.json'))
          print(f'Features: {len(rows)} rânduri')
          if len(rows) < 500:
              raise SystemExit('EROARE: Prea puțin features!')
          "

      # ─── TRAIN ────────────────────────────────────────────────────────────
      - name: Train CatBoost (fără SHAP pentru viteză)
        run: python3 train_engine_v2.py --skip-shap

      # ─── EXPORT ───────────────────────────────────────────────────────────
      - name: EV Calculator
        run: python3 ev_calculator.py
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        continue-on-error: true

      - name: Export JSON-uri frontend
        run: python3 export_app.py

      # ─── COMMIT ───────────────────────────────────────────────────────────
      - name: Commit și push
        run: |
          git config --global user.name  'SmartBet Bot'
          git config --global user.email 'bot@betanalytics.local'

          # Verifică că modelele există înainte de commit
          MODEL_COUNT=$(ls models/catboost_*.cbm 2>/dev/null | wc -l)
          echo "Modele găsite: $MODEL_COUNT"
          if [ "$MODEL_COUNT" -lt 3 ]; then
            echo "EROARE: Prea puține modele ($MODEL_COUNT). Training probabil a eșuat."
            exit 1
          fi

          # Adaugă modelele CatBoost + calibratoarele (.cbm + .pkl)
          git add models/ || echo "WARN: git add models/ a eșuat"
          echo "Modele adăugate la staging:"
          git diff --staged --name-only | grep models/ || echo "  (niciun model nou)"

          # Adaugă JSON-urile de output
          git add data/model_pack_v2.json         || true
          git add data/ev_signals_v2.json         || true
          git add data/shap_global_v2.json        || true
          git add data/smartbet_meta_v2.json      || true
          git add data/wfv_results_v2.json        || true
          git add data/calibration_report_v2.json || true
          git add data/league_baselines_v2.json   || true
          git add data/league_baselines_compact.json || true
          git add data/features_v2_summary.json   || true

          if git diff --staged --quiet; then
            echo "Nicio schimbare de committat."
          else
            git commit -m "chore(ml): SmartBet v2 retrain $(date -u +%Y-%m-%d)"

            # Fetch remote fără a suprascrie fișierele noastre ML
            git fetch origin

            # Merge remote cu strategia "ours" pentru conflicte pe fișiere de date
            # Fișierele noastre (modele + date ML) câștigă întotdeauna
            if git merge origin/main -X ours --no-edit -m "chore(ml): merge remote în retrain" 2>/dev/null; then
              echo "✅ Merge cu remote reușit (ours strategy)"
            else
              # Fallback: resolve manual conflictele pe fișierele noastre
              git checkout --ours data/ models/ 2>/dev/null || true
              git add data/ models/ 2>/dev/null || true
              git merge --continue --no-edit 2>/dev/null || \
              git commit -m "chore(ml): resolve conflicts after retrain" || true
            fi

            git push
            echo "✅ Modele și date ML committate cu succes."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
