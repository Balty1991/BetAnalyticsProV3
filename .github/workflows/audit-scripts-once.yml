name: Audit Scripts Once

on:
  push:
    paths:
      - '.cleanup/audit-scripts.trigger'

permissions:
  contents: write

jobs:
  audit-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate script audit
        run: python tools/audit_scripts_once.py
      - name: Commit script audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cleanup_script_audit.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add script audit report"
            git push
          fi
