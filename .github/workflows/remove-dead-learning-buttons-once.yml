name: Remove Dead Learning Buttons Once

on:
  push:
    paths:
      - '.cleanup/remove-dead-learning-buttons.trigger'

permissions:
  contents: write

jobs:
  remove-dead-learning-buttons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove dead learning buttons
        run: python tools/remove_dead_learning_buttons_once.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove dead learning navigation buttons"
            git push
          fi
