name: Sync VEYRA Brand Assets

on:
  push:
    paths:
      - '.cleanup/sync-veyra-brand-assets.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-veyra-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate VEYRA icons and align URLs
        run: |
          python -m pip install --upgrade pip
          pip install cairosvg
          python - <<'PY'
          from pathlib import Path
          import json, re
          import cairosvg

          root = Path('.')
          svg = root / 'assets' / 'veyra-icon.svg'
          if not svg.exists():
              raise SystemExit('Missing assets/veyra-icon.svg')

          for name, size in [
              ('icon-192.png', 192),
              ('icon-192-maskable.png', 192),
              ('icon-512.png', 512),
              ('icon-512-maskable.png', 512),
              ('apple-touch-icon.png', 180),
          ]:
              cairosvg.svg2png(url=str(svg), write_to=name, output_width=size, output_height=size)

          idx = root / 'index.html'
          if idx.exists():
              h = idx.read_text(encoding='utf-8')
              h = h.replace('https://balty1991.github.io/BetAnalyticsProV3/index.html', 'https://balty1991.github.io/VEYRA/')
              h = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/svg+xml" href="./assets/veyra-icon.svg?v=20260509veyra5"/>', h, count=1)
              h = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260509veyra5"/>', h, count=1)
              h = h.replace('20260509brand3', '20260509veyra5')
              h = h.replace('20260509brand2', '20260509veyra5')
              h = h.replace('20260509brand1', '20260509veyra5')
              idx.write_text(h, encoding='utf-8')

          man = root / 'manifest.json'
          if man.exists():
              d = json.loads(man.read_text(encoding='utf-8'))
              d['name'] = 'VEYRA · Sports Analytics AI'
              d['short_name'] = 'VEYRA'
              d['description'] = 'Sports analytics, predicții AI, ML5, tracking și istoric de performanță.'
              d['background_color'] = '#030812'
              d['theme_color'] = '#06080F'
              d['start_url'] = './index.html?v=veyra'
              d['scope'] = './'
              d['icons'] = [
                  {'src':'icon-192.png?v=20260509veyra5','sizes':'192x192','type':'image/png','purpose':'any'},
                  {'src':'icon-192-maskable.png?v=20260509veyra5','sizes':'192x192','type':'image/png','purpose':'maskable'},
                  {'src':'icon-512.png?v=20260509veyra5','sizes':'512x512','type':'image/png','purpose':'any'},
                  {'src':'icon-512-maskable.png?v=20260509veyra5','sizes':'512x512','type':'image/png','purpose':'maskable'},
              ]
              d['shortcuts'] = [
                  {'name':'Meciuri azi','short_name':'Meciuri','description':'Vezi meciurile cu cote și predicții','url':'./index.html?v=veyra#meciuri','icons':[{'src':'icon-192.png?v=20260509veyra5','sizes':'192x192'}]},
                  {'name':'Piramidă Daily','short_name':'Piramidă','description':'Reinvestire în etape cu selecții AI','url':'./index.html?v=veyra#piramida','icons':[{'src':'icon-192.png?v=20260509veyra5','sizes':'192x192'}]},
              ]
              man.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = root / 'README.md'
          readme.write_text('# VEYRA\n\nSports Analytics AI · ML5 predictions · performance tracking · pyramid strategy dashboard.\n\nLive app: https://balty1991.github.io/VEYRA/\n', encoding='utf-8')

          sw = root / 'sw.js'
          if sw.exists():
              s = sw.read_text(encoding='utf-8')
              s = re.sub(r"const CACHE='[^']+';", "const CACHE='veyra-runtime-20260509-icons5';", s)
              sw.write_text(s, encoding='utf-8')
          PY
      - name: Commit VEYRA brand asset sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json README.md sw.js icon-192.png icon-192-maskable.png icon-512.png icon-512-maskable.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync VEYRA brand assets and URLs"
            git push
          fi
