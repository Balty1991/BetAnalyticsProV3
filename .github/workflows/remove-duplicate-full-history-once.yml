name: Remove Duplicate Full History Once

on:
  push:
    paths:
      - '.cleanup/remove-duplicate-full-history.trigger'

permissions:
  contents: write

jobs:
  remove-duplicate-full-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove duplicate full-history-hotfix include
        run: python tools/remove_duplicate_full_history_once.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove duplicate full history hotfix include"
            git push
          fi
