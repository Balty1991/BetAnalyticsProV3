name: Apply VEYRA Rebrand Once

on:
  push:
    paths:
      - '.cleanup/apply-veyra-rebrand.trigger'

permissions:
  contents: write

jobs:
  apply-veyra-rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply VEYRA rebrand
        run: python tools/apply_veyra_rebrand_once.py
      - name: Commit VEYRA rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json README.md assets/app.css assets/veyra-icon.svg assets/veyra-logo.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebrand app to VEYRA"
            git push
          fi
