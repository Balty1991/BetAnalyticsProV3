name: Restore Browser Auto Refresh Once

on:
  push:
    paths:
      - '.cleanup/restore-browser-auto-refresh.trigger'

permissions:
  contents: write

jobs:
  restore-browser-auto-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore browser auto refresh
        run: python tools/restore_browser_auto_refresh_once.py
      - name: Commit auto refresh restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/performance-patch.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore browser auto refresh"
            git push
          fi
