name: Audit Ticket Generators Once

on:
  push:
    paths:
      - '.cleanup/audit-ticket-generators.trigger'

permissions:
  contents: write

jobs:
  audit-ticket-generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate ticket generator audit
        run: python tools/audit_ticket_generators_once.py
      - name: Commit ticket generator audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cleanup_ticket_generator_audit.json cleanup_ticket_generator_audit.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add ticket generator audit report"
            git push
          fi
