name: Cache Bust Manifest Once

on:
  push:
    paths:
      - '.cleanup/cache-bust-manifest.trigger'

permissions:
  contents: write

jobs:
  cache-bust-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache bust manifest and icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          h = re.sub(r'<link rel="manifest" href="[^"]+"\s*/>', '<link rel="manifest" href="manifest.json?v=20260509veyra6"/>', h, count=1)
          h = h.replace('20260509veyra5', '20260509veyra6')
          p.write_text(h, encoding='utf-8')

          sw = Path('sw.js')
          if sw.exists():
              s = sw.read_text(encoding='utf-8')
              s = re.sub(r"const CACHE='[^']+';", "const CACHE='veyra-runtime-20260509-icons6';", s)
              sw.write_text(s, encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Cache bust VEYRA manifest and icons"
            git push
          fi
