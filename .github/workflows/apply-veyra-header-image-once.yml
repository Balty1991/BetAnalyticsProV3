name: Apply VEYRA Header Image Once

on:
  push:
    paths:
      - '.cleanup/apply-veyra-header-image.trigger'

permissions:
  contents: write

jobs:
  apply-veyra-header-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply VEYRA header image
        run: python tools/apply_veyra_header_image_once.py
      - name: Commit VEYRA header image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use VEYRA full logo image in header"
            git push
          fi
