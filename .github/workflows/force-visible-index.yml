name: Force Visible Pro Index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.force-visible-index'
      - '.github/workflows/force-visible-index.yml'
      - 'assets/pro_command_center.js'
      - 'assets/pro_intelligence_runtime.js'

permissions:
  contents: write

concurrency:
  group: force-visible-pro-index
  cancel-in-progress: true

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch index titles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('BetAnalytics Pro · Aurora', 'BetAnalytics Pro · PRO V21')
          s = s.replace('AURORA · v17', 'PRO V21 · Intelligence')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --staged --quiet; then
            echo 'Index already patched.'
            exit 0
          fi
          git commit -m 'Force visible Pro V21 index redesign'
          git pull --rebase origin main || true
          git push
