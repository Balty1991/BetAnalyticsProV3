name: Apply performance patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/performance-patch.js'
      - 'sw.js'
      - '.github/workflows/apply-performance-patch.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert performance patch loader
        run: |
          set -e
          if grep -q 'performance-patch.js' index.html; then
            echo 'performance-patch.js already linked'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script defer src="./assets/app.js?v=20260423step6"></script>'
          new = '<script src="./assets/performance-patch.js?v=20260425perf"></script>\n' + old
          if old not in s:
              raise SystemExit('app.js script tag not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patched index
        run: |
          if git diff --quiet index.html; then
            echo 'No index.html changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable frontend performance patch'
          git push
