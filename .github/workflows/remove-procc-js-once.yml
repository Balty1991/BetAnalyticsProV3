name: Remove Pro Command Center JS Once

on:
  push:
    paths:
      - '.cleanup/remove-procc-js.trigger'

permissions:
  contents: write

jobs:
  remove-procc-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove pro_command_center JS reference and file
        run: python tools/remove_procc_js_once.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove unused pro command center JS"
            git push
          fi
