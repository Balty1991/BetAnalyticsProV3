name: Apply VEYRA Framed Brand

on:
  push:
    paths:
      - '.cleanup/apply-veyra-framed-brand.trigger'

permissions:
  contents: write

jobs:
  apply-veyra-framed-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply VEYRA framed brand
        run: python tools/apply_veyra_framed_brand_once.py
      - name: Commit VEYRA framed brand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Frame VEYRA logo in header"
            git push
          fi
